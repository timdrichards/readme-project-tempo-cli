<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" role="img" aria-label="Adding or editing a file and clicking Commit changes saves a snapshot called a commit. Each commit is kept in the history, so every earlier version can be opened." font-family="Arial, Helvetica, sans-serif">
<title>Adding or editing a file and clicking Commit changes saves a snapshot called a commit. Each commit is kept in the history, so every earlier version can be opened.</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#656d76"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker>
</defs>
<rect x="0" y="0" width="780" height="300" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="390" y="30" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold" >Every commit is a saved version. Nothing is lost.</text><rect x="20" y="52" width="200" height="70" rx="6" fill="#fff8c5" stroke="#656d76" stroke-width="1.5"/><text x="120" y="78" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold" >Add or edit a file</text><text x="120" y="98" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal" >in the GitHub editor</text><text x="120" y="113" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal" >(not saved yet)</text><line x1="220" y1="87" x2="318" y2="87" stroke="#0969da" stroke-width="2" marker-end="url(#ab)"/><text x="269" y="78" font-size="12" fill="#0969da" text-anchor="middle" font-weight="normal" >click</text><text x="269" y="108" font-size="11" fill="#0969da" text-anchor="middle" font-weight="normal" >Commit changes</text><rect x="320" y="52" width="210" height="70" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="425" y="78" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold" >Commit</text><text x="425" y="98" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal" >a saved snapshot of the files,</text><text x="425" y="113" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal" >with a short message</text><line x1="530" y1="87" x2="598" y2="87" stroke="#656d76" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="600" y="52" width="160" height="70" rx="6" fill="#ffffff" stroke="#656d76" stroke-width="1.5" stroke-dasharray="5 4"/><text x="680" y="78" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal" >Edit again,</text><text x="680" y="96" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal" >commit again</text><text x="680" y="114" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal" >as often as you like</text><text x="30" y="168" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold" >History</text><line x1="100" y1="200" x2="720" y2="200" stroke="#0969da" stroke-width="3" marker-end="url(#ab)"/><text x="730" y="204" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal" >time</text><circle cx="150" cy="200" r="9" fill="#ffffff" stroke="#0969da" stroke-width="3"/><text x="150" y="232" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold" >Create README.md</text><text x="150" y="248" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal" >title and description</text><text x="150" y="184" font-size="11" fill="#0969da" text-anchor="middle" font-weight="normal" >version 1</text><circle cx="320" cy="200" r="9" fill="#ffffff" stroke="#0969da" stroke-width="3"/><text x="320" y="232" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold" >Add Install and Usage</text><text x="320" y="248" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal" >two new sections</text><text x="320" y="184" font-size="11" fill="#0969da" text-anchor="middle" font-weight="normal" >version 2</text><circle cx="490" cy="200" r="9" fill="#ffffff" stroke="#0969da" stroke-width="3"/><text x="490" y="232" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold" >Fix the install command</text><text x="490" y="248" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal" >one line changed</text><text x="490" y="184" font-size="11" fill="#0969da" text-anchor="middle" font-weight="normal" >version 3</text><circle cx="660" cy="200" r="9" fill="#ffffff" stroke="#0969da" stroke-width="3"/><text x="660" y="232" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold" >Add API examples</text><text x="660" y="248" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal" >new section</text><text x="660" y="184" font-size="11" fill="#0969da" text-anchor="middle" font-weight="normal" >version 4</text><text x="390" y="284" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal" >Every version stays in the History. You can open any of them and see exactly what changed.</text>
</svg>
