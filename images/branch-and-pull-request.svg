<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="The README is written on a branch called readme-draft. A pull request collects reviewers comments and each new commit. After approval the branch is merged into main." font-family="Arial, Helvetica, sans-serif">
<title>The README is written on a branch called readme-draft. A pull request collects reviewers comments and each new commit. After approval the branch is merged into main.</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#656d76"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker>
</defs>
<rect x="0" y="0" width="900" height="320" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="450" y="30" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold" >Draft on a branch, review in a pull request, merge into main</text><text x="30" y="82" font-size="14" fill="#0969da" text-anchor="start" font-weight="bold" >main</text><line x1="80" y1="78" x2="860" y2="78" stroke="#0969da" stroke-width="3" marker-end="url(#ab)"/><circle cx="130" cy="78" r="9" fill="#ffffff" stroke="#0969da" stroke-width="3"/><text x="130" y="58" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal" >template files</text><circle cx="790" cy="78" r="11" fill="#ffffff" stroke="#0969da" stroke-width="3"/><text x="790" y="58" font-size="12" fill="#0969da" text-anchor="middle" font-weight="bold" >README.md arrives on main</text><text x="30" y="232" font-size="14" fill="#1a7f37" text-anchor="start" font-weight="bold" >readme-draft</text><path d="M130,87 C130,160 170,228 220,228" fill="none" stroke="#1a7f37" stroke-width="3"/><line x1="220" y1="228" x2="700" y2="228" stroke="#1a7f37" stroke-width="3"/><path d="M700,228 C760,228 790,160 790,92" fill="none" stroke="#1a7f37" stroke-width="3" marker-end="url(#ag)"/><text x="118" y="150" font-size="12" fill="#1a7f37" text-anchor="end" font-weight="normal" >1. create branch</text><circle cx="260" cy="228" r="9" fill="#ffffff" stroke="#1a7f37" stroke-width="3"/><text x="260" y="256" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold" >first draft</text><text x="260" y="272" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal" >commit</text><circle cx="420" cy="228" r="9" fill="#ffffff" stroke="#1a7f37" stroke-width="3"/><text x="420" y="256" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold" >revisions</text><text x="420" y="272" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal" >commit</text><circle cx="580" cy="228" r="9" fill="#ffffff" stroke="#1a7f37" stroke-width="3"/><text x="580" y="256" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold" >more revisions</text><text x="580" y="272" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal" >commit</text><text x="790" y="150" font-size="12" fill="#1a7f37" text-anchor="start" font-weight="normal" >5. merge</text><rect x="235" y="112" width="410" height="78" rx="6" fill="#fbefff" stroke="#8250df" stroke-width="1.5" stroke-dasharray="6 4"/><text x="440" y="134" font-size="13" fill="#8250df" text-anchor="middle" font-weight="bold" >Pull request: the place the review happens</text><text x="310" y="154" font-size="12" fill="#1f2328" text-anchor="middle">2. open it</text><text x="440" y="154" font-size="12" fill="#1f2328" text-anchor="middle">3. reviewers comment</text><text x="572" y="154" font-size="12" fill="#1f2328" text-anchor="middle">4. reviewers approve</text><text x="440" y="174" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal" >Each new commit on the branch shows up here automatically</text><text x="450" y="304" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal" >Nothing on readme-draft changes main until the merge. main stays the finished version.</text>
</svg>
