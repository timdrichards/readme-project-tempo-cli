<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="Write, commit, review, revise, and repeat. The same pull request loop that improves code improves a README." font-family="Arial, Helvetica, sans-serif">
<title>Write, commit, review, revise, and repeat. The same pull request loop that improves code improves a README.</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#656d76"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker>
</defs>
<rect x="0" y="0" width="760" height="340" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="380" y="30" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold" >The same loop improves code and prose</text><rect x="300" y="44" width="160" height="56" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="380" y="68" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold" >Write</text><text x="380" y="86" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal" >a draft, or a change</text><rect x="490" y="142" width="160" height="56" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="570" y="166" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold" >Commit</text><text x="570" y="184" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal" >save the version</text><rect x="300" y="240" width="160" height="56" rx="6" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/><text x="380" y="264" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold" >Review</text><text x="380" y="282" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal" >others read and comment</text><rect x="110" y="142" width="160" height="56" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="190" y="166" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold" >Revise</text><text x="190" y="184" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal" >act on the feedback</text><path d="M460,80 C520,90 560,115 570,140" fill="none" stroke="#656d76" stroke-width="1.8" marker-end="url(#a)"/><path d="M570,198 C560,230 520,255 460,262" fill="none" stroke="#656d76" stroke-width="1.8" marker-end="url(#a)"/><path d="M300,262 C240,255 200,230 190,198" fill="none" stroke="#656d76" stroke-width="1.8" marker-end="url(#a)"/><path d="M190,142 C200,115 240,90 300,80" fill="none" stroke="#656d76" stroke-width="1.8" marker-end="url(#a)"/><text x="380" y="164" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal" >each pass is a commit</text><text x="380" y="182" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal" >and nothing is lost</text><text x="380" y="322" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal" >Programmers review code this way every day. A README gets better the same way: a reader finds what is unclear.</text>
</svg>
