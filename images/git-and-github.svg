<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="GitHub is the website that holds your repository and lets people work together on it. Git is the tool inside that records files, commits and branches." font-family="Arial, Helvetica, sans-serif">
<title>GitHub is the website that holds your repository and lets people work together on it. Git is the tool inside that records files, commits and branches.</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#656d76"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker>
</defs>
<rect x="0" y="0" width="760" height="300" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="380" y="30" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold" >Your repository lives on GitHub. Git keeps its history.</text><rect x="20" y="48" width="500" height="232" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="36" y="70" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold" >GitHub: the website</text><rect x="40" y="84" width="250" height="180" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/><text x="165" y="106" font-size="14" fill="#0969da" text-anchor="middle" font-weight="bold" >Your repository</text><rect x="56" y="124" width="218" height="38" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="66" y="140" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold" >Files</text><text x="66" y="155" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal" >START.md, src/, README.md</text><rect x="56" y="170" width="218" height="38" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="66" y="186" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold" >History</text><text x="66" y="201" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal" >every commit, in order</text><rect x="56" y="216" width="218" height="38" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="66" y="232" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold" >Branches</text><text x="66" y="247" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal" >main, readme-draft</text><text x="165" y="276" font-size="12" fill="#0969da" text-anchor="middle" font-weight="normal" font-style="italic">Git does this part</text><rect x="310" y="84" width="194" height="180" rx="6" fill="#ffffff" stroke="#8250df" stroke-width="1.5"/><text x="407" y="106" font-size="14" fill="#8250df" text-anchor="middle" font-weight="bold" >Working together</text><rect x="326" y="124" width="162" height="38" rx="4" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/><text x="336" y="140" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold" >Collaborators</text><text x="336" y="155" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal" >who may see it</text><rect x="326" y="170" width="162" height="38" rx="4" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/><text x="336" y="186" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold" >Pull requests</text><text x="336" y="201" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal" >proposed changes</text><rect x="326" y="216" width="162" height="38" rx="4" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/><text x="336" y="232" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold" >Reviews</text><text x="336" y="247" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal" >comments, approval</text><text x="407" y="276" font-size="12" fill="#8250df" text-anchor="middle" font-weight="normal" font-style="italic">GitHub adds this part</text><circle cx="590" cy="90" r="13" fill="#fff8c5" stroke="#656d76" stroke-width="1.5"/><text x="612" y="88" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold" >You</text><text x="612" y="103" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal" >author</text><line x1="574" y1="90" x2="508" y2="90" stroke="#656d76" stroke-width="1.3" marker-end="url(#a)"/><circle cx="590" cy="142" r="13" fill="#fff8c5" stroke="#656d76" stroke-width="1.5"/><text x="612" y="140" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold" >Classmate 1</text><text x="612" y="155" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal" >reviewer</text><line x1="574" y1="142" x2="508" y2="142" stroke="#656d76" stroke-width="1.3" marker-end="url(#a)"/><circle cx="590" cy="194" r="13" fill="#fff8c5" stroke="#656d76" stroke-width="1.5"/><text x="612" y="192" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold" >Classmate 2</text><text x="612" y="207" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal" >reviewer</text><line x1="574" y1="194" x2="508" y2="194" stroke="#656d76" stroke-width="1.3" marker-end="url(#a)"/><circle cx="590" cy="246" r="13" fill="#fff8c5" stroke="#656d76" stroke-width="1.5"/><text x="612" y="244" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold" >Instructor</text><text x="612" y="259" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal" >and course staff</text><line x1="574" y1="246" x2="508" y2="246" stroke="#656d76" stroke-width="1.3" marker-end="url(#a)"/><text x="640" y="288" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal" >invited as collaborators</text>
</svg>
