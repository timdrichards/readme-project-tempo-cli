<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 314" width="900" height="314" role="img" aria-label="The seven phases: set up, draft, review, revise, approve, merge, submit. Phases 2 to 4 repeat until both reviewers approve. Phases 0 and 1 are in START.md, the rest in PEER.md." font-family="Arial, Helvetica, sans-serif">
<title>The seven phases: set up, draft, review, revise, approve, merge, submit. Phases 2 to 4 repeat until both reviewers approve. Phases 0 and 1 are in START.md, the rest in PEER.md.</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#656d76"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker>
</defs>
<rect x="0" y="0" width="900" height="314" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="450" y="30" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold" >The seven phases of the assignment</text><rect x="20" y="60" width="110" height="78" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="75" y="84" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold" >0. Set up</text><text x="75" y="104" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal" >add collaborators</text><line x1="130" y1="99" x2="144" y2="99" stroke="#656d76" stroke-width="1.6" marker-end="url(#a)"/><rect x="145" y="60" width="110" height="78" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="200" y="84" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold" >1. Draft</text><text x="200" y="104" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal" >branch</text><text x="200" y="119" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal" >and pull request</text><line x1="255" y1="99" x2="269" y2="99" stroke="#656d76" stroke-width="1.6" marker-end="url(#a)"/><rect x="270" y="60" width="110" height="78" rx="6" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/><text x="325" y="84" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold" >2. Review</text><text x="325" y="104" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal" >comment</text><text x="325" y="119" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal" >line by line</text><line x1="380" y1="99" x2="394" y2="99" stroke="#656d76" stroke-width="1.6" marker-end="url(#a)"/><rect x="395" y="60" width="110" height="78" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="450" y="84" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold" >3. Revise</text><text x="450" y="104" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal" >change,</text><text x="450" y="119" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal" >reply, re-request</text><line x1="505" y1="99" x2="519" y2="99" stroke="#656d76" stroke-width="1.6" marker-end="url(#a)"/><rect x="520" y="60" width="110" height="78" rx="6" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/><text x="575" y="84" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold" >4. Approve</text><text x="575" y="104" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal" >both reviewers</text><line x1="630" y1="99" x2="644" y2="99" stroke="#656d76" stroke-width="1.6" marker-end="url(#a)"/><rect x="645" y="60" width="110" height="78" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="700" y="84" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold" >5. Merge</text><text x="700" y="104" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal" >into main</text><line x1="755" y1="99" x2="769" y2="99" stroke="#656d76" stroke-width="1.6" marker-end="url(#a)"/><rect x="770" y="60" width="110" height="78" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="825" y="84" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold" >6. Submit</text><text x="825" y="104" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal" >PDF on Canvas</text><path d="M570,138 C570,190 450,190 450,142" fill="none" stroke="#8250df" stroke-width="2" marker-end="url(#ap)"/><text x="510" y="200" font-size="12" fill="#8250df" text-anchor="middle" font-weight="normal" >changes still needed: back to 3</text><text x="385" y="226" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold" >At least one full round of 2, 3 and 4 before anyone approves</text><line x1="20" y1="250" x2="255" y2="250" stroke="#0969da" stroke-width="2"/><text x="137" y="268" font-size="12" fill="#0969da" text-anchor="middle" font-weight="bold" >explained in START.md</text><line x1="270" y1="250" x2="880" y2="250" stroke="#8250df" stroke-width="2"/><text x="575" y="268" font-size="12" fill="#8250df" text-anchor="middle" font-weight="bold" >explained in PEER.md</text><rect x="20" y="284" width="14" height="14" rx="3" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="42" y="296" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal" >you, the author</text><rect x="170" y="284" width="14" height="14" rx="3" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/><text x="192" y="296" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal" >your two reviewers</text>
</svg>
